<!DOCTYPE html>
<html lang="en">
<head>
    <title>Tutorial 2</title>

    <style>
        .back {
            position: absolute;
            right: 20px;
            top: 20px;
            z-index: 9999;
            padding: 15px 20px;
            font-size: 1.2rem;
            background-color: #007bff;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            font-family: Arial, Helvetica, sans-serif;
            transition: background-color 0.3s ease;
        }
    </style>
</head>
<body>
    <a href="../index.html" class="back">
        Back to Home
    </a>

    <script>
        jumlahMhs = window.prompt("Jumlah Mahasiswa");
        for (i = 1; i <= jumlahMhs; i++) {
            console.log("test");
            let nama = window.prompt("Nama");
            let uts = parseInt(window.prompt("UTS"));
            let uas = parseInt(window.prompt("UAS"));
            let tugas = parseInt(window.prompt("Tugas"));

            document.write("<br /><br />" + i + ". " + nama + "<br />");
            document.write("Tugas : " + tugas);
            document.write("<br />UTS : " + uts);
            document.write("<br />UAS : " + uas);
        }
    </script>
</body>
</html>
