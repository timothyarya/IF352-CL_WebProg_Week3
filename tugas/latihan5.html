<!DOCTYPE html>
<html lang="en">
<head>
    <title>Tugas 5</title>

    <style>
        .back {
            position: absolute;
            right: 20px;
            top: 20px;
            z-index: 9999;
            padding: 15px 20px;
            font-size: 1.2rem;
            background-color: #007bff;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            font-family: Arial, Helvetica, sans-serif;
            transition: background-color 0.3s ease;
        }
    </style>
</head>
<body>
    <a href="../index.html" class="back">
        Back to Home
    </a>

    <script>
        limit = parseInt(window.prompt("Show angka ganjil sampai berapa?"));

        function showGanjil(limit) {
            for (let i = 1; i <= limit; i = i + 2) {
                document.write(`<h2>${i}</h2>`);
            }
        }
        showGanjil(limit);
    </script>
</body>
</html>
