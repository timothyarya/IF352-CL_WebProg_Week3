<!DOCTYPE html>
<html lang="en">
<head>
    <title>Tugas 7</title>

    <style>
        .back {
            position: absolute;
            right: 20px;
            top: 20px;
            z-index: 9999;
            padding: 15px 20px;
            font-size: 1.2rem;
            background-color: #007bff;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            font-family: Arial, Helvetica, sans-serif;
            transition: background-color 0.3s ease;
        }
    </style>
</head>
<body>
    <a href="../index.html" class="back">
        Back to Home
    </a>

    <script>
        let days = ["Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];

        document.write("<h1>Grafik Jumlah Kehadiran Mahasiswa</h1>");
        let graphKehadiran = days.map((day) => {
            let jumlahMhs = parseInt(window.prompt(`Berapa mahasiswa yang masuk hari ${day}? `));
            let graph = [];
            for (let i = 0; i < jumlahMhs; i++) {
                graph.push("X");
            }
            
            return `<p style="font-size: 24px;"><strong>${day}</strong> : ${graph.join("")}</p>`;
        }).join("");

        document.write(graphKehadiran); 
    </script>
</body>
</html>
