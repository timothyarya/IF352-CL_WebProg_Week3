<!DOCTYPE html>
<html lang="en">
<head>
    <title>Tugas 3</title>

    <style>
        .back {
            position: absolute;
            right: 20px;
            top: 20px;
            z-index: 9999;
            padding: 15px 20px;
            font-size: 1.2rem;
            background-color: #007bff;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            font-family: Arial, Helvetica, sans-serif;
            transition: background-color 0.3s ease;
        }
    </style>
</head>
<body>
    <a href="../index.html" class="back">
        Back to Home
    </a>
    
    <script>
        while (true) {
            jam = parseInt(window.prompt("Jam Berapa Sekarang??? (0-23)"));
            if (jam >= 0 && jam <= 23) {
                break;
            }
            alert("jam harus diantara 0-23");
        }

        if (jam >= 6 && jam <= 10) {
            alert("Selamat Pagi");
        } else if (jam >= 11 && jam <= 14) {
            alert("Selamat Siang");
        } else if (jam >= 15 && jam <= 17) {
            alert("Selamat Sore");
        } else if (jam >= 18 && jam <= 22) {
            alert("Selamat Malam");
        } else {
            alert("Selamat Tidur");
        }
    </script>
</body>
</html>
