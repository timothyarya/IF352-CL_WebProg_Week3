<!DOCTYPE html>
<html lang="en">
<head>
    <title>Hello World</title>
</head>
<body>
    <script>
        while (true) {
            limit = parseInt(window.prompt("Show angka prima sampai berapa?"));
            if (limit > 1) {
                break;
            }
            alert("Harus lebih dari 1");
        }

        function showPrima(limit) {
            let a = [];
            for (let i = 2; i <= limit; i++) {
                a[i] = 1;
            }

            let max = Math.sqrt(limit);
            for (let i = 2; i <= max; i++) {
                if (a[i] == 1) {
                    let j = i * 2;
                    while (j <= limit) {
                        a[j] = 0;
                        j += i;
                    }
                }
            }

            for (let i = 2; i <= limit; i++) {
                if (a[i] == 1) {
                    document.write(`<h2>${i}</h2>`);
                }
            }
        }
        showPrima(limit);
    </script>
</body>
</html>
