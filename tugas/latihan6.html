<!DOCTYPE html>
<html lang="en">
<head>
    <title>Tugas 6</title>

    <style>
        .back {
            position: absolute;
            right: 20px;
            top: 20px;
            z-index: 9999;
            padding: 15px 20px;
            font-size: 1.2rem;
            background-color: #007bff;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            font-family: Arial, Helvetica, sans-serif;
            transition: background-color 0.3s ease;
        }
    </style>
</head>
<body>
    <a href="../index.html" class="back">
        Back to Home
    </a>

    <script>
        while (true) {
            limit = parseInt(window.prompt("Show angka prima sampai berapa?"));
            if (limit > 1) {
                break;
            }
            alert("Harus lebih dari 1");
        }

        function showPrima(limit) {
            let a = [];
            for (let i = 2; i <= limit; i++) {
                a[i] = 1;
            }

            let max = Math.sqrt(limit);
            for (let i = 2; i <= max; i++) {
                if (a[i] == 1) {
                    let j = i * 2;
                    while (j <= limit) {
                        a[j] = 0;
                        j += i;
                    }
                }
            }

            for (let i = 2; i <= limit; i++) {
                if (a[i] == 1) {
                    document.write(`<h2>${i}</h2>`);
                }
            }
        }
        showPrima(limit);
    </script>
</body>
</html>
